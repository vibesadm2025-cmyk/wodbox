<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WODBOX</title>
<meta name="description" content="MVP do WODBOX: gestão e engajamento para boxes de cross. Dados de demonstração.">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WODBOX">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--bg2:#101013;--panel:#17171b;--panel2:#1e1e23;--line:#2a2a30;
  --ink:#f4f1ea;--muted:#a4a19a;--dim:#6f6d68;
  --accent:#ff5a1f;--accent-ink:#1a0d06;--lime:#c6ff3d;--lime-ink:#1a2200;--blue:#4cc9f0;--gold:#ffcc4d;--red:#ff4d4d;
  --display:"Bebas Neue","Oswald",Impact,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 6px}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:600px){body{background:#050506}#app{box-shadow:0 0 0 1px #1c1c20,0 40px 120px -40px #000}}
.hdr{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(12px + var(--safe-t)) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.14em;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.hdr .right{display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:16px}
.ib.badge{position:relative}.ib.badge::after{content:attr(data-n);position:absolute;top:-4px;right:-4px;background:var(--accent);color:#000;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
main{flex:1;padding:16px 16px calc(92px + var(--safe-b))}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(14,14,16,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + var(--safe-b));z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10.5px;letter-spacing:.04em;padding:6px 0;border-radius:12px}
.tabbar button .ic{font-size:20px;line-height:1}
.tabbar button.on{color:var(--lime)}
h1{font-family:var(--display);font-size:38px;line-height:.95;letter-spacing:.02em}
h2{font-family:var(--display);font-size:26px;letter-spacing:.04em;line-height:1}
h3{font-family:var(--display);font-size:20px;letter-spacing:.05em;line-height:1}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}.dim{color:var(--dim)}.lm{color:var(--lime)}.hl{color:var(--accent)}.gd{color:var(--gold)}.bl{color:var(--blue)}
.sm{font-size:12.5px}.xs{font-size:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.acc{border-color:rgba(255,90,31,.55)}.card.lime{border-color:rgba(198,255,61,.5)}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px 18px;font-weight:700;font-size:14px;letter-spacing:.03em;width:100%;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--accent);color:var(--accent-ink)}.btn.l{background:var(--lime);color:var(--lime-ink)}
.btn.g{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:9px 12px;font-size:12.5px;width:auto;border-radius:10px}
.btn.d{background:rgba(255,77,77,.12);border:1px solid rgba(255,77,77,.4);color:#ff8a8a}
.btn[disabled]{opacity:.45;pointer-events:none}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);font-weight:600}
.tag.acc{border-color:var(--accent);color:var(--accent)}.tag.lime{border-color:var(--lime);color:var(--lime)}.tag.red{border-color:var(--red);color:#ff8a8a}.tag.gold{border-color:var(--gold);color:var(--gold)}.tag.blue{border-color:var(--blue);color:var(--blue)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#000;flex-shrink:0}
.av.s{width:28px;height:28px;font-size:10px}
.big{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.03em}
.xp{height:8px;background:#26262c;border-radius:999px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),#7dff9a);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.xp.o i{background:var(--accent)}.xp.b i{background:var(--blue)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item.tap{cursor:pointer}.item.tap:active{background:var(--panel2)}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-weight:600;font-size:14px}.item .t span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.streak{display:flex;gap:5px}.streak i{flex:1;height:26px;border-radius:7px;background:#232329;display:grid;place-items:center;font-size:13px}
.streak i.ok{background:var(--accent)}.streak i.fz{background:var(--blue)}.streak i.now{outline:2px dashed var(--lime);outline-offset:-2px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;font-size:11px;line-height:1.3}
.bd .e{font-size:24px;display:block;margin-bottom:4px}.bd.lk{opacity:.38;filter:grayscale(1)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.lb .item .pos{font-family:var(--display);font-size:22px;color:var(--dim);width:26px;text-align:center}
.lb .item:nth-child(1) .pos{color:var(--gold)}.lb .item:nth-child(2) .pos{color:#d0d0d0}.lb .item:nth-child(3) .pos{color:#c98a4b}
.lb .item .sc{font-family:var(--display);font-size:22px;color:var(--lime);letter-spacing:.03em}
.item.me{border-color:rgba(198,255,61,.5);background:rgba(198,255,61,.04)}
.feed .item{align-items:flex-start}.feed .txt{font-size:13.5px;line-height:1.4}.feed .txt b{font-weight:600}.feed .meta{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
.feed .meta button{color:var(--muted);display:inline-flex;gap:5px;align-items:center;font-weight:600}.feed .meta button.on{color:var(--lime)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .n{font-family:var(--display);font-size:32px;line-height:1;letter-spacing:.03em}.kpi .l{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.kpi.warn .n{color:#ff8a8a}.kpi.good .n{color:var(--lime)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:480px;background:var(--bg2);border-radius:24px 24px 0 0;padding:14px 18px calc(22px + var(--safe-b));max-height:88vh;overflow:auto;border-top:1px solid var(--line);animation:up .28s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}
.toasts{position:fixed;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--lime);border-radius:14px;padding:12px 14px;font-size:13.5px;box-shadow:0 20px 50px -20px #000;animation:tin .3s ease}
.toast.o{border-left-color:var(--accent)}.toast.g{border-left-color:var(--gold)}.toast b{font-weight:700}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + var(--safe-b));gap:18px;background:radial-gradient(600px 400px at 85% 10%,rgba(255,90,31,.22),transparent 60%),var(--bg)}
.login h1{font-size:64px}.login h1 span{color:var(--accent);display:block}
.role{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;width:100%}
.role .e{font-size:28px}.role b{display:block;font-size:15px}.role span{font-size:12.5px;color:var(--muted)}
.role:active{background:var(--panel2)}
.wodcard{background:linear-gradient(160deg,#1a1a1f,#101013);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;overflow:hidden;margin-bottom:12px}
.wodcard::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(198,255,61,.18),transparent 70%)}
.wodcard h2{font-size:40px;color:var(--lime)}
.wodcard pre{font-family:var(--body);white-space:pre-wrap;color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:8px}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.cls b{display:block;font-family:var(--display);font-size:20px;letter-spacing:.04em}.cls span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.cls.full{opacity:.7}.cls.mine{border-color:var(--lime);background:rgba(198,255,61,.06)}.cls.mine b{color:var(--lime)}
.cls.wait{border-color:var(--blue)}
.pr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.pr:last-child{border:0}.pr b{font-family:var(--display);font-size:20px;letter-spacing:.03em;color:var(--lime)}
.team{display:flex;align-items:center;gap:10px;margin-bottom:10px}.team .nm{width:92px;font-weight:600;font-size:13px}.team .xp{flex:1}.team .v{font-family:var(--display);font-size:18px;width:72px;text-align:right}
.empty{text-align:center;color:var(--dim);padding:28px 12px;font-size:13.5px}
.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,31,.5)}60%{box-shadow:0 0 0 12px rgba(255,90,31,0)}}
.levelup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.75);text-align:center;padding:30px}
.levelup .box{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.levelup h1{font-size:72px;color:var(--lime)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.demo{font-size:11px;color:var(--dim);text-align:center;margin-top:18px;line-height:1.5}
.demo button{color:var(--muted);text-decoration:underline}
.table{width:100%;border-collapse:collapse;font-size:13px}.table td{padding:9px 4px;border-bottom:1px solid var(--line)}.table td:last-child{text-align:right;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>

<script>
/* =====================================================================

const STORE='wodbox-mvp-v1';
const BOX={name:'Gladys 27', city:'Vitória · ES'};
const TODAY=new Date(); const todayKey=TODAY.toISOString().slice(0,10);
const fmtDate=d=>d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace('.','');

const XP={checkin:10,result:15,benchmark:30,pr:50,week:40,bump:2,bumpCap:10,referral:100};
const LEVELS=[['Rookie',0],['Atleta',500],['Veterano',1500],['Elite',3500],['Lenda do box',7500]];

const COLORS=['#c6ff3d','#4cc9f0','#ffcc4d','#ff5a1f','#f472b6','#a78bfa','#34d399','#fb923c'];

    ['a14','Nina K.','RX',26,'preto',1890,6,'Ilimitado',189,'ativo',1,10,{Fran:[['2026-06-01','7:11']]},{'Clean':70,'Back Squat':100,'Deadlift':130,'Snatch':50}],
    ['a15','Vitor S.','Scaled',31,'lima',300,1,'Experimental',0,'ativo',0,0,{},{}],
    ['a16','Dani F.','RX',29,'azul',2010,5,'Ilimitado',189,'ativo',16,18,{Fran:[['2026-06-01','6:58']]},{'Clean':80,'Back Squat':110,'Deadlift':140,'Snatch':55}],

}
const inits=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();

function mkWods(){
  const d=n=>{const x=new Date(TODAY);x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
  return [
    {id:'w0',date:d(0),title:'Fran',type:'For time',benchmark:true,published:true,desc:'21-15-9\nThrusters 43/30 kg\nPull-ups',rx:'Thrusters 43/30 kg · Pull-ups',scaled:'Thrusters 30/20 kg · Ring rows',cap:'Time cap 10 min',score:'time'},

    {id:'w2',date:d(2),title:'Helen',type:'For time',benchmark:true,published:true,desc:'3 rounds\n400 m run\n21 KB swings 24/16\n12 pull-ups',score:'time'},

    {id:'w5',date:d(1+6),title:'Grace',type:'For time',benchmark:true,published:true,desc:'30 Clean & Jerk 61/43 kg',score:'time'},

function mkClasses(){
  return [
    {id:'c1',time:'06:00',coach:'Coach Léo',cap:14,att:['a2','a3','a5','a6','a8','a11','a14','a9','a10','a4','a16','a12']},
    {id:'c2',time:'07:00',coach:'Coach Léo',cap:14,att:['a7','a13','a15','a2','a3','a11','a14','a5','a6','a8','a9']},

  ];

function mkFeed(){

function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.athletes){S=s;return}}catch(e){}S=fresh()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
function reset(){localStorage.removeItem(STORE);S=fresh();render();toast('Dados de demonstração restaurados','o')}
const me=()=>S.athletes.find(a=>a.id==='me');
const byId=id=>S.athletes.find(a=>a.id===id);
const todayWod=()=>S.wods.find(w=>w.date===todayKey)||S.wods[0];
function levelOf(xp){let l=0;LEVELS.forEach((x,i)=>{if(xp>=x[1])l=i});return l}
function levelProg(xp){const l=levelOf(xp);const cur=LEVELS[l][1],next=LEVELS[l+1]?LEVELS[l+1][1]:null;return {l,name:LEVELS[l][0],cur,next,pct:next?Math.round((xp-cur)/(next-cur)*100):100}}
function addXP(n,why){const m=me();const before=levelOf(m.xp);m.xp+=n;S.teamXP[m.team]+=n;save();toast(`<b>+${n} XP</b> · ${why}`);if(levelOf(m.xp)>before){setTimeout(()=>levelUp(LEVELS[levelOf(m.xp)][0]),500)}}

/* ---------- util UI ---------- */
const $=s=>document.querySelector(s);
function toast(html,cls=''){const t=document.createElement('div');t.className='toast '+cls;t.innerHTML=html;$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400)},2600)}
function sheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheetbg').classList.add('on')}
function closeSheet(){$('#sheetbg').classList.remove('on')}
$('#sheetbg').addEventListener('click',e=>{if(e.target.id==='sheetbg')closeSheet()});
function levelUp(name){const d=document.createElement('div');d.className='levelup';d.innerHTML=`<div class="box"><div class="kicker">Subiu de nível</div><h1>${name}</h1><p class="muted" style="margin:10px 0 18px">Passa na recepção: tem uma recompensa do box esperando por você.</p><button class="btn l" style="width:auto;padding:12px 28px">Bora 💥</button></div>`;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)}
const avatar=(a,s='')=>`<span class="av ${s}" style="background:${a.color}">${inits(a.name)}</span>`;
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<60)return m+' min';const h=Math.round(m/60);if(h<24)return h+' h';return Math.round(h/24)+' d'};

  }

}

function tabbar(items,cur,key){return `<nav class="tabbar">${items.map(i=>`<button class="${cur===i[0]?'on':''}" data-a="${key}" data-v="${i[0]}"><span class="ic">${i[1]}</span>${i[2]}</button>`).join('')}</nav>`}

  <button class="role" data-a="login" data-v="gestao"><span class="e">📊</span><div><b>Entrar como gestão</b><span>Dono e coaches: WOD, turmas, alunos, caixa</span></div></button>

/* ---------- ATLETA · HOJE ---------- */
function viewHoje(){
  const m=me(),w=todayWod(),lp=levelProg(m.xp),res=S.results[w.id];
  const cls=S.classes.map(c=>{const full=c.att.length>=c.cap,mine=S.myCheckin===c.id,wait=S.myWait===c.id;return `<button class="cls ${full?'full':''} ${mine?'mine':''} ${wait?'wait':''}" data-a="checkin" data-v="${c.id}"><b>${c.time}</b><span>${mine?'✓ você vai':wait?'na fila':full?'lotada · fila':(c.cap-c.att.length)+' vagas'}</span></button>`}).join('');
  const wk=S.weekDone.map((d,i)=>`<i class="${d?'ok':''} ${i===TODAY.getDay()-1||(TODAY.getDay()===0&&i===6)?'now':''}">${d?'🔥':''}</i>`).join('');
  return `<div class="row between" style="margin-bottom:12px"><div><div class="kicker">${fmtDate(TODAY)}</div><h1>Fala, ${m.name.split(' ')[0]}.</h1></div><div style="text-align:right"><div class="big lm">🔥 ${m.streak}</div><div class="xs muted">semanas de streak</div></div></div>
  <div class="wodcard"><div class="row between"><span class="tag lime">${w.type}</span>${w.benchmark?'<span class="tag gold">Benchmark</span>':''}</div><h2 style="margin-top:10px">${w.title}</h2><pre>${w.desc}</pre>${w.cap?`<div class="xs dim" style="margin-top:6px">${w.cap}</div>`:''}

      :`<button class="btn l ${S.myCheckin?'':'pulse'}" style="margin-top:12px" data-a="result">${S.myCheckin?'Registrar resultado':'Registrar resultado'}</button>`}
  </div>
  <div class="card"><div class="row between"><div><div class="xs muted">Nível ${lp.l+1} · ${lp.name}</div><div class="big">${m.xp.toLocaleString('pt-BR')} XP</div></div><div class="sm muted" style="text-align:right">${lp.next?`faltam ${(lp.next-m.xp).toLocaleString('pt-BR')}<br>para ${LEVELS[lp.l+1][0]}`:'nível máximo'}</div></div><div class="xp" style="margin-top:10px"><i style="width:${lp.pct}%"></i></div></div>
  <div class="card"><div class="row between"><h3>Semana</h3><span class="xs muted">meta ${S.weekDone.filter(Boolean).length}/${S.weekGoal} treinos · <button class="lm" data-a="goal">mudar</button></span></div><div class="streak" style="margin-top:10px">${wk}</div><div class="xs dim" style="margin-top:8px">Fechou a meta, +${XP.week} XP e o streak continua. Lesão ou viagem? <button class="bl" data-a="freeze">Congelar streak</button></div></div>

  <button class="btn g" data-a="invite">🎟 Convidar um amigo para aula experimental · +${XP.referral} XP</button>

function teamRank(t){const arr=Object.entries(S.teamXP).sort((a,b)=>b[1]-a[1]);return arr.findIndex(x=>x[0]===t)+1}

function doCheckin(cid){
  const c=S.classes.find(x=>x.id===cid);
  if(S.myCheckin===cid){c.att=c.att.filter(x=>x!=='me');S.myCheckin=null;save();render();toast('Check-in cancelado','o');return}
  if(S.myWait===cid){c.wait=(c.wait||[]).filter(x=>x!=='me');S.myWait=null;save();render();toast('Saiu da fila','o');return}
  if(S.myCheckin){const o=S.classes.find(x=>x.id===S.myCheckin);o.att=o.att.filter(x=>x!=='me')}
  if(S.myWait){const o=S.classes.find(x=>x.id===S.myWait);o.wait=(o.wait||[]).filter(x=>x!=='me');S.myWait=null}
  if(c.att.length>=c.cap){c.wait=c.wait||[];c.wait.push('me');S.myWait=cid;S.myCheckin=null;save();render();toast(`Você está na fila da aula das ${c.time}. Avisamos se abrir vaga.`,'o');return}
  c.att.push('me');S.myCheckin=cid;const m=me();m.checkins++;if(parseInt(c.time)<7)S.early++;m.lastCheckin=0;
  const dow=(TODAY.getDay()+6)%7;if(!S.weekDone[dow]){S.weekDone[dow]=1;S.challenge.mine++;}
  S.feed.unshift({id:'f'+Date.now(),who:'me',kind:'checkin',txt:`fez check-in às ${c.time} · ${c.att.length} pessoas na aula`,t:Date.now(),bumps:0});
  save();render();addXP(XP.checkin,`check-in às ${c.time}`);
  if(S.weekDone.filter(Boolean).length===S.weekGoal)setTimeout(()=>addXP(XP.week,'semana completa na meta'),900);
  checkBadges();
}
function checkBadges(){const m=me();const had=S.badgesHad||[];const now=BADGES.filter(b=>b[3](Object.assign({early:S.early},m))).map(b=>b[0]);const neu=now.filter(x=>!had.includes(x));S.badgesHad=now;save();if(had.length&&neu.length){neu.forEach(id=>{const b=BADGES.find(x=>x[0]===id);setTimeout(()=>toast(`${b[1]} Badge desbloqueada: <b>${b[2]}</b>`,'g'),1200);S.feed.unshift({id:'fb'+Date.now(),who:'me',kind:'badge',txt:`desbloqueou a badge <b>${b[2]}</b> ${b[1]}`,t:Date.now(),bumps:0})});save()}}

function sheetResult(){
  const w=todayWod(),m=me(),r=S.results[w.id]||{};
  const ph={time:'mm:ss, ex. 5:42',load:'kg, ex. 120',reps:'total de reps',rounds:'rounds + reps, ex. 19+7'}[w.score]||'resultado';
  sheet(`<div class="kicker">${w.title} · ${w.type}</div><h2 style="margin:6px 0 4px">Registrar resultado</h2><p class="sm muted">${w.benchmark?`Benchmark: vale +${XP.benchmark} XP e entra no seu histórico.`:`Vale +${XP.result} XP.`}</p>
  <label>Resultado</label><input id="r-score" placeholder="${ph}" value="${r.score||''}" inputmode="${w.score==='time'?'numeric':'decimal'}">
  <label>Versão</label><div class="seg" id="r-cat"><button class="${(r.cat||m.cat)==='RX'?'on':''}" data-v="RX">RX</button><button class="${(r.cat||m.cat)==='Scaled'?'on':''}" data-v="Scaled">Scaled</button></div>
  <label>Percepção de esforço · ${r.rpe||7}/10</label><input id="r-rpe" type="range" min="1" max="10" value="${r.rpe||7}" style="padding:0;accent-color:var(--accent)">
  <label>Comentário (opcional)</label><input id="r-note" placeholder="como foi?" value="${r.note||''}">
  <div style="height:14px"></div><button class="btn l" id="r-save">Salvar e publicar no feed</button>`);
  $('#r-cat').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('#r-cat').children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};
  $('#r-rpe').oninput=e=>{e.target.previousElementSibling.textContent=`Percepção de esforço · ${e.target.value}/10`};
  $('#r-save').onclick=()=>{
    const score=$('#r-score').value.trim();if(!score){toast('Coloque o resultado','o');return}
    const cat=$('#r-cat .on').dataset.v,rpe=+$('#r-rpe').value,note=$('#r-note').value.trim();const isNew=!S.results[w.id];
    let pr=false;
    if(w.benchmark&&w.score==='time'){const prev=(m.bench[w.title]||[]).map(x=>toSec(x[1])).filter(Boolean);const s=toSec(score);if(s&&(!prev.length||s<Math.min(...prev)))pr=true;}
    S.results[w.id]={score,cat,rpe,note,pr};
    if(isNew){if(w.benchmark){m.bench[w.title]=m.bench[w.title]||[];m.bench[w.title].push([todayKey,score]);}
      S.feed.unshift({id:'fr'+Date.now(),who:'me',kind:'result',txt:`fechou <b>${w.title}</b> em <b>${score}</b> ${cat}${note?' · "'+note+'"':''}${pr?' 🏆 PR':''}`,t:Date.now(),bumps:0});}
    save();closeSheet();render();
    if(isNew){addXP(w.benchmark?XP.benchmark:XP.result,w.benchmark?'benchmark registrado':'resultado registrado');if(pr)setTimeout(()=>addXP(XP.pr,`novo PR em ${w.title}!`),900);checkBadges()}else toast('Resultado atualizado');
  };
}
const toSec=s=>{const p=String(s).split(':').map(Number);if(p.length===2&&!p.some(isNaN))return p[0]*60+p[1];return null};

/* ---------- ATLETA · FEED ---------- */
function viewFeed(){
  const items=S.feed.slice(0,30).map(f=>{const a=f.who==='team'?{name:'Desafio',color:'#ff5a1f'}:byId(f.who);const on=S.bumped[f.id];return `<div class="item"><span class="av" style="background:${a.color}">${f.who==='team'?'⚑':inits(a.name)}</span><div class="t"><div class="txt"><b>${f.who==='me'?'Você':a.name}</b> ${f.txt}</div><div class="meta"><span>${ago(f.t)}</span><button class="${on?'on':''}" data-a="bump" data-v="${f.id}">👊 ${f.bumps+(on?1:0)}</button><button data-a="comment" data-v="${f.id}">💬 comentar</button></div></div></div>`}).join('');

}

/* ---------- ATLETA · PERFIL ---------- */
function viewPerfil(){
  const m=me(),lp=levelProg(m.xp),ctx=Object.assign({early:S.early},m);
  const bd=BADGES.map(b=>`<div class="bd ${b[3](ctx)?'':'lk'}"><span class="e">${b[1]}</span>${b[2]}</div>`).join('');

    matricular(){const a=byId(v);a.plan='3x semana';a.price=149;a.months=1;closeSheet();save();render();toast(`<b>${a.name} matriculado.</b> App liberado e boas-vindas enviadas.`)},
    congelar(){closeSheet();toast('Plano congelado por 30 dias. Streak pausado.','o')},
    novoaluno(){sheet(`<h2>Novo aluno</h2><label>Nome</label><input id="na-n" placeholder="nome"><label>Plano</label><select id="na-p"><option>Experimental</option><option>3x semana</option><option>Ilimitado</option></select><label>Categoria</label><select id="na-c"><option>Scaled</option><option>RX</option></select><div style="height:14px"></div><button class="btn l" id="na-ok">Cadastrar</button>`);$('#na-ok').onclick=()=>{const n=$('#na-n').value.trim();if(!n){toast('Coloque o nome','o');return}const p=$('#na-p').value;const t=Object.keys(TEAMS)[S.athletes.length%4];S.athletes.push({id:'a'+Date.now(),name:n,cat:$('#na-c').value,age:30,team:t,xp:0,streak:0,plan:p,price:p==='Ilimitado'?189:p==='3x semana'?149:0,status:'ativo',lastCheckin:0,months:0,bench:{},prs:{},color:COLORS[S.athletes.length%COLORS.length],checkins:0,bumps:0});save();closeSheet();render();toast(`<b>${n}</b> cadastrado no Time ${TEAMS[t][0]}.`)}},
  };
  if(acts[a])acts[a]();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;save();const pos=e.target.selectionStart;render();const i=$('#q');if(i){i.focus();i.setSelectionRange(pos,pos)}}});

load();{const r=new URLSearchParams(location.search).get('role');if(r){S.role=r==='gestao'?'gestao':'atleta';save()}}render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
